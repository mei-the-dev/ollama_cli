[pytest]
markers =
    live: marks tests as live-model integration
    slow: marks slow tests
    fast: marks fast tests
    SingularityAgent: marks tests that require the Singularity agent or agent-related fixtures
    agent: marks tests that exercise agent behaviors or start MCP servers
    model_event_logger: tests that emit structured model events via the fixture
    event_reader: tests that use the event_reader helper to wait/read events
    generate_streaming: marks tests that exercise generate_streaming behavior
    execute_streaming: marks tests exercising execute_streaming behavior
